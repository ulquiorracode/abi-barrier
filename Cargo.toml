[workspace]
members = [
    "crates/abi-barrier-core",
    "crates/abi-barrier-derive",
    "crates/abi-barrier",
    "benches",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["UlquiorraCode Contributors", "GoldSrc Architecture Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ulquiorracode/abi-barrier"
keywords = ["ffi", "c-abi", "safety", "barrier", "zero-cost"]
categories = ["rust-patterns", "api-bindings", "no-std"]

[workspace.dependencies]
abi-barrier-core = { path = "crates/abi-barrier-core", version = "0.1.0" }
abi-barrier-derive = { path = "crates/abi-barrier-derive", version = "0.1.0" }
abi-barrier = { path = "crates/abi-barrier", version = "0.1.0" }

stitch-core = { git = "https://github.com/stitch-rs/stitch-framework.git", branch = "main", default-features = false }
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
criterion = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
